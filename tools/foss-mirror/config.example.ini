; ===================================================================
;  ตัวอย่างไฟล์ตั้งค่า foss-mirror
;  วิธีใช้: คัดลอกไฟล์นี้เป็น config.ini (อยู่โฟลเดอร์เดียวกับ foss_mirror.py)
;  แล้วแก้ค่าที่ต้องการ  -- config.ini ถูก .gitignore ไว้ ไม่ถูกส่งขึ้น GitHub
;  บรรทัดที่ขึ้นต้นด้วย ; คือคำอธิบาย ไม่มีผลกับโปรแกรม (เขียนหลังค่าได้ เช่น  workers = 2 ; ค่าต่ำ)
;  บันทึกไฟล์เป็น UTF-8 เสมอ  และระวัง Windows ซ่อนนามสกุลไฟล์ (อาจได้ config.ini.ini โดยไม่รู้ตัว)
;  ค่าที่ไม่ได้ใส่ จะใช้ค่าเริ่มต้นตามที่เขียนไว้ในไฟล์นี้
; ===================================================================

[source]
; ที่อยู่ repo แบบ F-Droid (ค่าเริ่มต้น: repo หลักของ F-Droid) - ต้องขึ้นต้นด้วย https://
; ใช้ repo อื่นที่เป็นรูปแบบ F-Droid ได้ เช่น IzzyOnDroid: https://apt.izzysoft.de/fdroid/repo
repo = https://f-droid.org/repo
; มิเรอร์เพิ่มเติมสำหรับดาวน์โหลด APK (คั่นด้วยจุลภาค ต้องเป็น https) - เว้นว่างได้
mirrors =
; true = ใช้มิเรอร์ที่ประกาศไว้ในดัชนีของ repo ด้วย (กระจายโหลด ไม่ให้ภาระตกที่เซิร์ฟเวอร์หลัก)
; มิเรอร์ .onion และ http (ไม่เข้ารหัส) จะถูกข้ามเสมอ
use_index_mirrors = true
; เวลารอการเชื่อมต่อ (วินาที)
timeout = 60
; จำนวนครั้งที่ลองใหม่เมื่อเน็ตหลุด/เซิร์ฟเวอร์ตอบผิดพลาด
retries = 4

[filter]
; แอปที่มี anti-feature เหล่านี้จะไม่ถูกนำมาเผยแพร่ (คั่นด้วยจุลภาค)
;   KnownVuln = มีช่องโหว่ที่รู้แล้ว, Tracking = ติดตามผู้ใช้, Ads = มีโฆษณา, NSFW = เนื้อหาผู้ใหญ่
;   NoSourceSince = ไม่มีซอร์สโค้ดของเวอร์ชันนี้, NonFreeAssets = มีไฟล์ที่ไม่ใช่โอเพนซอร์ส
exclude_antifeatures = KnownVuln, NoSourceSince, NonFreeAssets, Tracking, Ads, NSFW
;   (needs_obb = แอปที่ต้องใช้ไฟล์ .obb เพิ่ม จะถูกข้ามเสมอ เพราะ APK อย่างเดียวใช้งานไม่ได้)
; false = รับเฉพาะแอปที่สัญญาอนุญาตเป็นโอเพนซอร์สที่อนุมัติ (แนะนำ ห้ามเปลี่ยนถ้าไม่แน่ใจ)
;   สัญญาแบบ "A OR B" ผ่านถ้ามีอย่างน้อยหนึ่งตัวที่อนุมัติ  แบบ "A AND B" ต้องอนุมัติทุกตัว
allow_any_license = false
; รหัส SPDX ของสัญญาอนุญาตเพิ่มเติมที่ยอมรับ (คั่นด้วยจุลภาค) - เว้นว่างได้
; ดูว่าสัญญาไหนถูกปฏิเสธบ่อยด้วยคำสั่ง stats (หัวข้อ rejected licences)
extra_licenses =
; ถ้าแอปแยก APK ตามสถาปัตยกรรม (ABI) จะเลือกเฉพาะไฟล์ที่ใช้กับ ABI นี้ได้ (หรือแบบ universal)
; ถ้าไม่มี จะใช้ ABI ที่เข้ากันได้ (arm64-v8a -> armeabi-v7a) ไม่เลือก x86 ให้มือถือ ARM
preferred_abi = arm64-v8a
; ข้าม APK ที่ใหญ่กว่านี้ (MB)
max_size_mb = 1024

[naming]
; รูปแบบชื่อไฟล์  ตัวแปรที่ใช้ได้: {name} {version} {package} {versionCode}
; ตัวอย่างผลลัพธ์: Super-Game-v2.0-Y4APK.COM.apk
filename_template = {name}-v{version}-Y4APK.COM.apk
; รูปแบบตำแหน่งไฟล์ใน bucket  ตัวแปรเพิ่ม: {folder} {filename}
; ตัวอย่างผลลัพธ์: S/Super-Game-v2.0-Y4APK.COM.apk
key_template = {folder}/{filename}
; โฟลเดอร์สำหรับชื่อที่ไม่ได้ขึ้นต้นด้วย A-Z (เช่น 2048...) - bucket เดิมใช้ A
nonalpha_folder = A

[scan]
; วิธีสแกนไวรัส: clamav | virustotal | clamav+virustotal | none
; none ใช้ได้เฉพาะทดสอบกับ --dest local เท่านั้น (ถ้าปลายทางเป็น r2 โปรแกรมจะไม่ยอมรัน)
scan = clamav
; ที่อยู่โปรแกรม clamscan
;   Windows ตัวอย่าง: C:\Program Files\ClamAV\clamscan.exe
;   Linux/GitHub Actions: clamscan
clamscan_path = clamscan
; ตัวเลือกเพิ่มให้ clamscan: ค่าเริ่มต้นของ ClamAV สแกนไฟล์ได้แค่ 25 MB ต่อไฟล์ และ 2 นาทีต่อไฟล์
; จึงขยายเป็น 1024 MB และ 600000 มิลลิวินาที (10 นาที) เพื่อให้สแกน APK ใหญ่ได้ครบ
; โปรแกรมใส่ --alert-exceeds-max=yes ให้เองเสมอ: ถ้าไฟล์เกินขีดจำกัดจนสแกนไม่ครบ จะถือว่า "สแกนไม่ผ่าน"
; และไม่อัปโหลด (ถ้าเปลี่ยน max_size_mb ให้ปรับ --max-filesize/--max-scansize ตามด้วย)
clamscan_args = --max-filesize=1024M --max-scansize=1024M --max-scantime=600000
; เวลาสูงสุดในการสแกนหนึ่งไฟล์ (วินาที)
clamscan_timeout = 900
; true = ย้ายไฟล์ที่ติดไวรัส/สแกนไม่ผ่านไปไว้ใน work/quarantine/ (ปกติ false = ลบทิ้ง)
keep_quarantine = false

[virustotal]
; API key ของ VirusTotal (หรือใส่ใน environment variable VT_API_KEY) - เว้นว่างถ้าไม่ใช้
api_key =
; true = ถ้า VirusTotal ยังไม่รู้จักไฟล์ ให้อัปโหลดไฟล์ไปสแกน (ไฟล์ FOSS เปิดเผยได้ ไม่มีความลับ)
upload_unknown = true
; ถ้าจำนวนเอนจินที่บอกว่าอันตราย "มากกว่า" ค่านี้ จะไม่อัปโหลด
; (แอปโอเพนซอร์สบางครั้งโดนเตือนผิด 1-2 เอนจิน จำนวนจะถูกบันทึกในแคตตาล็อก)
max_malicious = 2
; จำนวนคำขอต่อนาที (บัญชีฟรีได้ 4 ครั้ง/นาที, 500 ครั้ง/วัน)
requests_per_minute = 4
; ระยะห่างการเช็กผลสแกน (วินาที) และเวลารอสูงสุด (วินาที)
poll_interval = 30
poll_timeout = 1200

[dest]
; ปลายทาง: r2 = Cloudflare R2 (ใช้จริง) | local = คัดลอกลงโฟลเดอร์ในเครื่อง (ไว้ดูตัวอย่าง)
backend = r2
; โฟลเดอร์ปลายทางเมื่อใช้ local (หรือใช้ --dest-dir ตอนสั่งรัน)
local_dir =
; ตำแหน่งไฟล์แคตตาล็อกใน bucket (ใช้จำว่าอัปโหลดอะไรไปแล้ว + เอาไปทำโพสต์)
catalog_key = catalog/foss-apps.json
; true = เก็บสำเนาซอร์สโค้ดของเวอร์ชันนั้น (ไฟล์ _src.tar.gz จาก F-Droid) ไว้ใน bucket ที่ src/
; จำเป็นสำหรับ GPL/AGPL: ต้องให้ซอร์สได้ตลอดเวลาที่ยังแจก APK อยู่ แต่ F-Droid จะย้าย/ลบไฟล์ซอร์สเก่าภายหลัง
; (ถ้าดาวน์โหลดซอร์สไม่ได้ แอปนั้นจะ failed และไม่อัปโหลด APK)
mirror_source = true

[r2]
; ค่าจาก Cloudflare dashboard > R2 (ใส่ที่นี่ หรือใน environment variables ชื่อในวงเล็บ)
; Account ID (R2_ACCOUNT_ID) - ดูได้จาก S3 API ในหน้า R2 > files > Settings: https://<ACCOUNT_ID>.r2.cloudflarestorage.com
account_id =
; Access Key ID ของ R2 API token (R2_ACCESS_KEY_ID)
access_key_id =
; Secret Access Key ของ R2 API token (R2_SECRET_ACCESS_KEY) - ห้ามแชร์ให้ใคร
secret_access_key =
; ชื่อ bucket (R2_BUCKET)
bucket = files
; URL สาธารณะของ bucket สำหรับทำลิงก์ดาวน์โหลด (Custom Domain ของ bucket files) (R2_PUBLIC_BASE_URL)
public_base_url = https://files.y4apk.net

[run]
; จำนวนไฟล์ที่ดาวน์โหลดพร้อมกัน (แนะนำ 1-3 เพื่อไม่ให้ภาระกับ F-Droid)
workers = 2
; โฟลเดอร์ทำงาน (แคช, ไฟล์ชั่วคราว, log, catalog.json) - ถ้าไม่ใช่ path เต็ม จะนับจากโฟลเดอร์ของสคริปต์
work_dir = work
; true = เก็บไฟล์ APK ไว้ในเครื่องหลังอัปโหลดเสร็จ (ปกติลบเพื่อประหยัดพื้นที่)
keep_files = false
